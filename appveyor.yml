version: 1.0.{build}
image: Visual Studio 2022

install:
- ps: >-
    Start-FileDownload "https://launchpad.net/gcc-arm-embedded/4.9/4.9-2014-q4-major/+download/gcc-arm-none-eabi-4_9-2014q4-20141203-win32.zip"

    Import-Module ".\AppVeyor\PS-Zip\PS-Zip.psm1" -Force

    .\AppVeyor\install.ps1

# Determine the actual GCC root inside the extracted folder and expose it
# as an AppVeyor environment variable for the build_script step.
- ps: >-
    $gcc = Get-ChildItem -Path "C:\projects\gcc-arm-none-eabi-4_9" -Filter "arm-none-eabi-gcc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

    if (-not $gcc) { throw "arm-none-eabi-gcc.exe not found" }

    $gccRoot = Split-Path $gcc.DirectoryName -Parent

    Write-Host "GCC_DIR=$gccRoot"

    Set-AppveyorBuildVariable -Name GCC_DIR -Value $gccRoot

build_script:
- cmd: >-
    call setenv_gcc.cmd 4.9.3 "%GCC_DIR%"

    cd Solutions\ToppersHRP2onEV3

    MSBuild dotnetmf.proj /t:rebuild /p:flavor=release;memory=flash /nologo /v:minimal

    cd ..\..

    cd DeviceCode\Targets\OS\Toppers\hrp2\workspace\helloev3onnetmf

    MSBuild dotnetmf.proj /t:rebuild /p:flavor=release;memory=flash /nologo /v:minimal

artifacts:
- path: BuildOutput\ARM\GCC4.9\le\FLASH\release\ToppersHRP2onEV3\obj\DeviceCode\Targets\OS\Toppers\hrp2\workspace\helloev3onnetmf\hrp2
  name: Release
