name: CMake configure check

# The CMake entry points added for the Windows build environment are thin
# orchestration layers (they locate the toolchain / MSBuild / make and drive
# the existing build systems). This workflow does not run a full firmware
# build - that is covered by build.yml - it verifies that both CMakeLists.txt
# files still *configure* correctly, which catches syntax errors and broken
# find_program()/configure_file() logic early.

on:
  push:
    branches: [ master, main, "claude/**" ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'DeviceCode/Targets/OS/Toppers/hrp2/CMakeLists.txt'
      - '.github/workflows/cmake.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'DeviceCode/Targets/OS/Toppers/hrp2/CMakeLists.txt'
      - '.github/workflows/cmake.yml'
  workflow_dispatch:

jobs:
  configure:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Same cache key as build.yml so both workflows share the download.
      - name: Cache GCC ARM toolchain
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: C:\tools\gcc-arm
          key: gcc-arm-none-eabi-4_9-2014q4-20141203-win32

      - name: Download GCC ARM toolchain
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://launchpadlibrarian.net/192228054/gcc-arm-none-eabi-4_9-2014q4-20141203-win32.zip"
          $zip = "$env:TEMP\gcc-arm-none-eabi-4_9.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          New-Item -ItemType Directory -Force -Path "C:\tools\gcc-arm" | Out-Null
          Expand-Archive -Path $zip -DestinationPath "C:\tools\gcc-arm" -Force

      - name: Export toolchain bin directory
        shell: pwsh
        run: |
          $gcc = Get-ChildItem -Path "C:\tools\gcc-arm" -Filter "arm-none-eabi-gcc.exe" -Recurse -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $gcc) { throw "arm-none-eabi-gcc.exe not found under C:\tools\gcc-arm" }
          Write-Host "Toolchain bin: $($gcc.DirectoryName)"
          $gcc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ------------------------------------------------------------------
      # Root CMakeLists.txt - drives the MSBuild / appveyor.yml equivalent
      # ------------------------------------------------------------------
      - name: Configure root project (MSBuild wrapper)
        shell: pwsh
        run: cmake -S . -B build-msbuild

      - name: Verify generated run_appveyor_build.cmd
        shell: pwsh
        run: |
          $cmd = "build-msbuild\run_appveyor_build.cmd"
          if (-not (Test-Path $cmd)) { throw "$cmd was not generated by configure_file()" }
          Write-Host "--- $cmd ---"
          Get-Content $cmd
          # No @PLACEHOLDER@ tokens should survive configure_file(... @ONLY)
          $unresolved = Select-String -Path $cmd -Pattern '@[A-Za-z_][A-Za-z0-9_]*@'
          if ($unresolved) {
            $unresolved | ForEach-Object { Write-Host "unresolved: $_" }
            throw "run_appveyor_build.cmd still contains unsubstituted @VAR@ placeholders"
          }

      # ------------------------------------------------------------------
      # HRP2 kernel CMakeLists.txt - drives the GNU Make + cfg.exe build.
      # Needs make + a POSIX shell, both bundled with the runner's Git
      # for Windows installation.
      # ------------------------------------------------------------------
      - name: Configure HRP2 kernel project (GNU Make wrapper)
        shell: pwsh
        working-directory: DeviceCode/Targets/OS/Toppers/hrp2
        run: |
          # Git for Windows ships make/sh under usr\bin on the hosted runner.
          $gitUsrBin = "C:\Program Files\Git\usr\bin"
          if (Test-Path $gitUsrBin) { $env:PATH = "$gitUsrBin;$env:PATH" }
          cmake -S . -B build-make
